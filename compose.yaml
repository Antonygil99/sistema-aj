services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aj_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_aj}
    volumes:
      - aj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aj_postgres:
